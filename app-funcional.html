<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pusheen Fit">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23000%22/><text y=%2265%22 x=%2220%22 font-size=%2250%22>🐱</text></svg>">
    <title>Pusheen Fit v3.0 - Clínico</title>
    <style>
        /* --- SISTEMA VISUAL (CSS) --- */
        :root {
            --bg-puro: #000000; --bg-tarjeta: #09090b; --bg-control: #18181b; --borde: #27272a;
            --accent: #22c55e; --texto-prio: #ffffff; --texto-sec: #a1a1aa; --azul-clinico: #38bdf8;
            --oro: #fbbf24; --oro-fondo: rgba(251, 191, 36, 0.05); --alerta: #ef4444;
        }
        body[data-theme="kenia"] {
            --bg-puro: #fff0f5; --bg-tarjeta: #ffffff; --bg-control: #ffe4e1; --borde: #ffb6c1;
            --accent: #ff69b4; --texto-prio: #4a4a4a; --texto-sec: #8b7b8b; --azul-clinico: #2a9d8f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-puro); font-family: -apple-system, sans-serif; color: var(--texto-prio); line-height: 1.4; touch-action: pan-y; user-select: none; padding-top: env(safe-area-inset-top); overflow-x: hidden;}
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg-tarjeta); border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 100; }
        .pusheen-profile { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--borde); background: #333; display: flex; align-items: center; justify-content: center; font-size: 24px;}
        .profile-selector { display: flex; gap: 4px; background: var(--bg-control); padding: 4px; border-radius: 12px; border: 1px solid var(--borde); }
        .profile-btn { border: none; background: transparent; color: var(--texto-sec); font-size: 0.75rem; font-weight: 900; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .profile-btn.active { background: var(--bg-puro); color: var(--texto-prio); box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .btn-metronomo { background: #111; border: 1px solid #333; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn-metronomo.active { border-color: var(--accent); box-shadow: 0 0 15px rgba(34,197,94,0.4); }
        
        #app-canvas { padding: 16px; padding-bottom: 120px; max-width: 500px; margin: 0 auto; animation: fade 0.3s ease; }
        @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .routine-selector { width: 100%; padding: 12px; font-size: 0.9rem; font-weight: 900; background: var(--bg-tarjeta); color: var(--texto-prio); border: 1px solid var(--borde); border-radius: 14px; margin-bottom: 16px; text-align: center; outline: none; }
        .card-exercise { background: var(--bg-tarjeta); border: 1px solid var(--borde); border-radius: 20px; padding: 16px; margin-bottom: 16px; transition: 0.3s; width: 100%; position: relative;}
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-size: 1.1rem; font-weight: 900; }
        .badge-musculo { font-size: 0.65rem; background: var(--bg-control); padding: 4px 8px; border-radius: 6px; font-weight: 800; color: var(--texto-sec); text-transform: uppercase; text-align:right; }
        .clinical-box { background: var(--bg-puro); padding: 12px; border-radius: 0 12px 12px 0; font-size: 0.75rem; color: var(--texto-sec); margin-bottom: 16px; border: 1px solid var(--borde); border-left: 3px solid var(--azul-clinico); }
        .badge-alerta { color: #ef4444; font-weight: 900; }
        
        .history-box { background: var(--bg-control); padding: 10px; border-radius: 12px; margin-bottom: 12px; font-size: 0.75rem; font-weight: 800; color: var(--texto-sec); text-align: center; border: 1px dashed var(--borde); }
        .history-item { color: var(--accent); font-family: monospace; font-size: 0.85rem; margin-top: 4px; display: inline-block; background: var(--bg-puro); padding: 4px 8px; border-radius: 6px; margin-right: 4px; }
        .history-item.aprox { color: var(--texto-sec); border: 1px dashed var(--texto-sec); opacity: 0.7; }
        
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .cell-input { background: var(--bg-puro); padding: 8px; border-radius: 16px; border: 1px solid var(--borde); display: flex; flex-direction: column; }
        .cell-title { font-size: 0.65rem; font-weight: 900; color: var(--texto-sec); text-transform: uppercase; margin-bottom: 8px; text-align: center; }
        .flex-controls { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
        .btn-step { background: var(--bg-control); border: 1px solid var(--borde); color: var(--texto-prio); width: 36px; height: 36px; border-radius: 8px; font-size: 1.5rem; font-weight: 900; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        input[type="number"], input[type="text"] { background: transparent; border: none; color: var(--texto-prio); font-size: 1.5rem; font-weight: 900; text-align: center; width: 100%; min-width: 0; padding: 0; outline: none; }
        
        .btn-record { display: block; width: 100%; height: 50px; background: linear-gradient(135deg, var(--accent) 0%, #16a34a 100%); border: none; border-radius: 12px; color: white; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; cursor: pointer; text-align: center; margin-bottom: 8px; box-shadow: 0 4px 15px rgba(34,197,94,0.3); }
        .btn-aprox { background: var(--bg-puro); color: var(--texto-sec); border: 1px dashed var(--texto-sec); width: 100%; height: 36px; border-radius: 10px; font-size: 0.75rem; font-weight: 900; cursor: pointer; margin-bottom: 12px; text-transform: uppercase; }
        .btn-undo { background: var(--bg-control); border: 1px solid var(--borde); color: var(--texto-prio); width: 100%; height: 36px; border-radius: 10px; font-size: 0.75rem; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-tecnica { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: var(--azul-clinico); width: 100%; height: 36px; border-radius: 10px; font-size: 0.75rem; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-bottom: 12px;}
        .btn-finish-workout { background: linear-gradient(135deg, var(--oro) 0%, #d97706 100%); color: #000; width: 100%; height: 56px; border-radius: 16px; font-weight: 900; font-size: 1.1rem; margin-top: 16px; border: none; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4); }
        
        .sets-header { display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 900; color: var(--texto-sec); margin-bottom: 6px; }
        .sets-bar-bg { height: 6px; background: var(--bg-control); border-radius: 3px; display: flex; overflow: hidden; margin-bottom: 12px; width: 100%; }
        .sets-bar-segment { flex: 1; border-right: 1px solid var(--bg-tarjeta); }
        .sets-bar-segment.filled { background: var(--accent); }
        
        .focus-nav-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(24, 24, 27, 0.85); border: 1px solid var(--borde); border-radius: 16px; padding: 6px; backdrop-filter: blur(10px); margin-top: 16px; }
        .btn-focus-nav { background: var(--bg-puro); color: var(--texto-prio); border: 1px solid var(--borde); padding: 12px 16px; border-radius: 12px; font-weight: 900; font-size: 0.8rem; flex: 1; cursor: pointer; text-align: center;}
        .btn-focus-nav:disabled { opacity: 0.2; cursor: not-allowed; }
        .focus-indicator { flex: 1.5; text-align: center; font-weight: 900; color: var(--texto-sec); font-size: 0.85rem; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: rgba(9, 9, 11, 0.95); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--borde); padding-bottom: env(safe-area-inset-bottom); z-index: 1000; backdrop-filter: blur(20px); }
        .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: 1; padding: 10px 0; opacity: 0.5; transition: 0.2s; }
        .nav-btn.active { opacity: 1; transform: translateY(-2px); }
        .nav-icon { font-size: 1.4rem; }
        .nav-text { font-size: 0.6rem; font-weight: 800; color: var(--texto-prio); }
        
        .global-timer { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; background: rgba(34, 197, 94, 0.15); border: 1px solid var(--accent); border-radius: 16px; padding: 12px; z-index: 998; backdrop-filter: blur(10px); }
        .timer-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .timer-lbl { font-size: 0.75rem; font-weight: 900; color: var(--texto-prio); }
        .timer-val { font-size: 1.8rem; font-weight: 900; font-family: monospace; color: var(--accent); }
        .timer-actions { display: flex; gap: 8px; }
        .btn-timer-macro, .btn-timer-skip { flex: 1; padding: 10px; border-radius: 10px; font-weight: 900; font-size: 0.8rem; border: none; cursor: pointer; }
        .btn-timer-macro { background: var(--bg-puro); color: var(--texto-prio); border: 1px solid var(--borde); }
        .btn-timer-skip { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .timer-progress-bg { height: 4px; background: var(--bg-puro); border-radius: 2px; overflow: hidden; margin-top: 10px; }
        .timer-progress-fill { height: 100%; background: var(--accent); width: 100%; }
        
        #toast-message { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--texto-prio); color: var(--bg-puro); padding: 12px 24px; border-radius: 30px; font-weight: 900; font-size: 0.85rem; z-index: 10000; display: none; opacity: 0; transition: opacity 0.3s; text-align: center; max-width: 90%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .toast-oro { background: var(--oro) !important; color: #000 !important; font-size: 0.95rem !important; }

        /* --- MODALES --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); }
        .triage-card { background: var(--bg-tarjeta); border: 1px solid var(--borde); border-radius: 24px; padding: 24px; width: 100%; max-width: 400px; text-align: center; }
        .triage-title { font-size: 1.2rem; font-weight: 900; margin-bottom: 6px; color: var(--texto-prio); text-transform:uppercase;}
        .triage-subtitle { font-size: 0.8rem; color: var(--texto-sec); margin-bottom: 24px; font-weight: 800; font-style: italic; }
        .btn-triage { width: 100%; padding: 16px; margin-top: 12px; border-radius: 12px; font-weight: 900; font-size: 1rem; border: none; cursor: pointer; text-transform: uppercase; background: var(--accent); color:#fff; transition: transform 0.1s; }
        .btn-triage:active { transform: scale(0.98); }

        /* TABLA MÓDULOS DE DESPACHO */
        .dispatch-btn { width: 100%; padding: 14px; background: var(--bg-puro); border: 1px solid var(--borde); border-radius: 12px; color: var(--texto-prio); font-weight: 900; font-size: 0.85rem; text-align: left; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .dispatch-btn:active { transform: scale(0.98); }
        .dispatch-btn.audit { border-color: var(--oro); color: var(--oro); }
        .dispatch-btn.rescate { border-color: #ef4444; color: #fca5a5; }

        /* --- MAPA ANATÓMICO PUSHEEN --- */
        .mapa-anatomico { overflow: hidden; }
        .mapa-anatomico svg { display: block; width: 100%; height: auto; }
        .borde-exterior { stroke: #3E2723; stroke-width: 6px; stroke-linecap: round; stroke-linejoin: round; }
        .division-interna { stroke: #3E2723; stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
        svg g[id^="m-"] { cursor: pointer; transition: filter 0.3s ease; }
        svg g[id^="m-"]:hover { filter: drop-shadow(0 0 8px rgba(62, 39, 35, 0.5)); }
        .glow { animation: pulso-clinico 1.6s infinite ease-in-out; }
        @keyframes pulso-clinico {
            0%, 100% { filter: drop-shadow(0 0 3px var(--accent, #22c55e)) drop-shadow(0 0 8px var(--accent, #22c55e)); }
            50% { filter: drop-shadow(0 0 10px var(--accent, #22c55e)) drop-shadow(0 0 20px var(--accent, #22c55e)); }
        }

    </style>
</head>
<body data-theme="julio">

    <!-- TRIAGE PRE-VUELO (OBJETIVO) -->
    <div id="modal-triage" class="modal-overlay" style="display:none;">
        <div class="triage-card">
            <div class="triage-title">🩺 Evaluación de Daños</div>
            <div class="triage-subtitle" id="triage-merly-quote">El ego miente, la fisiología no. Ingresa tus horas de sueño real. Compramos tiempo para verla crecer.</div>
            
            <div style="background:var(--bg-puro); padding:16px; border-radius:16px; border:1px solid var(--borde); margin-bottom:16px;">
                <label style="font-size:0.75rem; font-weight:900; color:var(--texto-sec); display:block; margin-bottom:8px;">HORAS DE SUEÑO:</label>
                <input type="number" id="input-sueno" inputmode="decimal" placeholder="Ej: 6.5" style="font-size:3rem; color:var(--accent); font-weight:900; text-align:center; width:100%; background:transparent; border:none; outline:none;">
            </div>

            <button class="btn-triage" onclick="evaluarSueno()">CALIBRAR SISTEMA</button>
        </div>
    </div>

    <!-- MODAL VIDEO -->
    <div id="modal-video" class="modal-overlay" style="display:none;">
        <img id="video-player" src="" style="max-width:90%; max-height:60vh; border-radius:16px; border: 2px solid var(--borde); background: var(--bg-puro);">
        <button onclick="document.getElementById('modal-video').style.display='none'" style="margin-top:24px; padding:16px 32px; background:var(--bg-tarjeta); color:var(--texto-prio); border:1px solid var(--borde); border-radius:12px; font-weight:900; font-size:1rem; cursor:pointer;">CERRAR VISOR</button>
    </div>

    <header class="top-bar">
        <div style="font-weight:900; font-size:1.1rem; letter-spacing:1px; display:flex; align-items:center; gap:8px;">
            <div class="pusheen-profile">🐱</div>

        <div style="display: flex; gap: 6px;">
            <button class="btn-metronomo" id="btnMetro" onclick="controlMetronomo()">🔊</button>
        </div>

    <main id="app-canvas"></main>

    <div id="global-rest-timer" class="global-timer" style="display:none;">
        <div class="timer-info">
            <span class="timer-lbl">⏳ RECUPERACIÓN (SWIPE ↔️)</span>
            <span class="timer-val" id="rest-time-display">00:00</span>

        <div class="timer-actions">
            <button class="btn-timer-macro" onclick="ajustarDescanso(15)">+15s</button>
            <button class="btn-timer-skip" onclick="cancelarDescanso()">OMITIR ⏩</button>
        </div>
        <div class="timer-progress-bg"><div class="timer-progress-fill" id="rest-progress-fill"></div></div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="nav-entrenar" onclick="cambiarVista('entrenar')"><span class="nav-icon">🏋️</span><span class="nav-text">Ejecución</span></button>
        <button class="nav-btn" id="nav-cardio" onclick="cambiarVista('cardio')"><span class="nav-icon">🫁</span><span class="nav-text">Longevidad</span></button>
        <button class="nav-btn" id="nav-planeacion" onclick="cambiarVista('planeacion')"><span class="nav-icon">📋</span><span class="nav-text">Comando</span></button>
        <button class="nav-btn" id="nav-metricas" onclick="cambiarVista('metricas')"><span class="nav-icon">📈</span><span class="nav-text">Clínico</span></button>
    </nav>

            "pecho": "Pecho", "pecho superior": "Pecho", "pecho inferior": "Pecho", "pectoral": "Pecho",

        function claveMusculo(texto) {
            return String(texto || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();
        }

        function normalizarMusculo(musculoDB) {
            const texto = String(musculoDB || "").trim();
            if (!texto) return [];
            const claves = [];
            texto.split(/\s+y\s+/i).forEach(parte => {
                const clave = claveMusculo(parte);
                if (!clave) return;
                let canonica = MUSCULO_ALIASES[clave] || null;
                if (!canonica) {
                    const alias = Object.keys(MUSCULO_ALIASES).find(k => clave.includes(k));
                    if (alias) canonica = MUSCULO_ALIASES[alias];
                }
                if (!canonica && PUSHEEN_ANATOMY_MAP[parte]) canonica = parte;
                if (canonica && !claves.includes(canonica)) claves.push(canonica);
            });
            return claves;
        }

        function iluminarMusculo(musculoDB) {
            document.querySelectorAll('g[id^="m-"]').forEach(el => el.classList.remove("glow"));
            const ids = new Set();
            normalizarMusculo(musculoDB).forEach(clave => {
                (PUSHEEN_ANATOMY_MAP[clave] || []).forEach(id => ids.add(id));
            });
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add("glow");
            });
            return Array.from(ids);
        }

                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                } catch (err) {}
            }

            if(horas >= 6.5) ejecutarTriage('ALFA');

            else ejecutarTriage('GAMMA');
        }

            document.getElementById('modal-triage').style.display = 'none';

            if(lastWorkout) {

        let audioCtx = null; let metronomoActivo = false; let loopMetronomo = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' }); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function dispararClick(frecuencia, duracion) {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(frecuencia, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracion);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duracion);
        }
        function controlMetronomo() {
            let btn = document.getElementById('btnMetro');
            if(metronomoActivo) { clearInterval(loopMetronomo); metronomoActivo = false; btn.classList.remove('active'); estado.metronomoPausadoPorDescanso = false; } 
            else { initAudio(); loopMetronomo = setInterval(() => dispararClick(880, 0.05), 1000); metronomoActivo = true; btn.classList.add('active'); }
        }

        function calcularTotalHoy() {
            let t = 0; let hoy = new Date().toISOString().slice(0,10);
            for (let r in estado.db.rutinas) { 
                estado.db.rutinas[r].ejercicios.forEach(ej => { 
                    if(ej.tipo !== "time_seconds" && ej.tipo !== "time_to_failure" && !ej.es_casa && !ej.nombre.includes("HRR")) { 
                        let logs = JSON.parse(localStorage.getItem(`logs_${estado.perfil}_${ej.nombre.replace(/[^a-zA-Z0-9]/g, '')}`)) || []; 
                        logs.filter(l => l.fecha === hoy && !l.is_aprox).forEach(l => { t += (l.val1 * l.val2); }); 
                    } 
                }); 
            }
            return t;
        }

        function verificarResetMatutino(hash) {
            let ultimaFechaCaptura = localStorage.getItem(`date_${estado.perfil}_${hash}`);
            let hoy = new Date();
            let fechaHoyStr = hoy.toISOString().slice(0,10);
            
            if (ultimaFechaCaptura && ultimaFechaCaptura !== fechaHoyStr) {
                let limiteReset = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate(), 6, 0, 0);
                if (hoy >= limiteReset) {
                    let actualV1 = localStorage.getItem(`t_${estado.perfil}_1_${hash}`);
                    let actualV2 = localStorage.getItem(`t_${estado.perfil}_2_${hash}`);
                    if (actualV1 && actualV1 !== "0") localStorage.setItem(`ghost_${estado.perfil}_1_${hash}`, actualV1);
                    if (actualV2 && actualV2 !== "0") localStorage.setItem(`ghost_${estado.perfil}_2_${hash}`, actualV2);
                    
                    localStorage.setItem(`t_${estado.perfil}_1_${hash}`, "0");
                    localStorage.setItem(`t_${estado.perfil}_2_${hash}`, "0");
                    localStorage.setItem(`date_${estado.perfil}_${hash}`, fechaHoyStr);
                }
            } else if (!ultimaFechaCaptura) {
                localStorage.setItem(`date_${estado.perfil}_${hash}`, fechaHoyStr);
            }
        }

        /* --- RENDER PRINCIPAL DE ENTRENAMIENTO --- */
        function renderEntrenar() {
            let canvas = document.getElementById('app-canvas');
            if(estado.indices[estado.rutina] === undefined) estado.indices[estado.rutina] = 0;
            
            let bloqueOriginal = estado.db.rutinas[estado.rutina];
            let bloque = JSON.parse(JSON.stringify(bloqueOriginal));
            const idx = estado.indices[estado.rutina]; const ej = bloque.ejercicios[idx];
            const hash = ej.nombre.replace(/[^a-zA-Z0-9]/g, '');

            verificarResetMatutino(hash);

            let l1 = "Peso (kg)"; 
            let l2 = ej.es_tiempo ? "Segundos" : "Reps"; 
            if (ej.es_casa) { l1 = "Pausa (s)"; l2 = "Reps"; }
            if (ej.nombre.includes("HRR") || ej.nombre.includes("GAMMA")) { l1 = "Pulso PICO"; l2 = "Pulso 60s"; }

            let htmlProgresion = "";
            if (v1 === "0" && v2 === "0" && !ej.es_tiempo && !ej.es_casa && !ej.nombre.includes("HRR")) {
                let ghostV1 = localStorage.getItem(`ghost_${estado.perfil}_1_${hash}`);

        function registrarSerie(nombre, isAprox, restSeconds) {
            let h = nombre.replace(/[^a-zA-Z0-9]/g, ''); 
            let v1 = parseFloat(document.getElementById(`val1-${h}`).value)||0; 
            let v2 = parseInt(document.getElementById(`val2-${h}`).value)||0;
            let el3 = document.getElementById(`val3-${h}`);
            let v3 = el3 ? parseInt(el3.value)||0 : 0;
            
            let logs = JSON.parse(localStorage.getItem(`logs_${estado.perfil}_${h}`)) || []; 
            logs.push({fecha: new Date().toISOString().slice(0,10), val1: v1, val2: v2, val3: v3, is_aprox: isAprox}); 
            localStorage.setItem(`logs_${estado.perfil}_${h}`, JSON.stringify(logs));
            
            if (!isAprox) {
                localStorage.setItem(`t_${estado.perfil}_1_${h}`, v1); 
                localStorage.setItem(`t_${estado.perfil}_2_${h}`, v2);
                localStorage.setItem(`date_${estado.perfil}_${h}`, new Date().toISOString().slice(0,10));
                localStorage.setItem(`last_workout_date_${estado.perfil}`, new Date().toISOString().slice(0,10));
                
                if (nombre.includes("HRR") || nombre.includes("GAMMA")) {
                    let caida = v1 - v2;
                    mostrarToast(`🩺 Caída de pulso: ${caida} lpm.<br> ${caida > 25 ? 'Óptima recuperación vagal.' : 'Recuperación baja, alerta SNC.'}`, true);

                    mostrarToast(`✓ Efectiva Guardada: ${v1} x ${v2} ${v3?'+'+v3+'P':''}`);

                mostrarToast(`⚖️ Calentamiento Guardado. No suma al tonelaje.`);
            }

            if (ejActual) {
                localStorage.setItem(`ultimo_musculo_${estado.perfil}`, ejActual.musculo || "General");
                iluminarMusculo(ejActual.musculo);
            }

            iniciarDescansoGlobal(restSeconds || 90);

        function deshacerSerie(n) { let h = n.replace(/[^a-zA-Z0-9]/g, ''); let hoy = new Date().toISOString().slice(0,10); let logs = JSON.parse(localStorage.getItem(`logs_${estado.perfil}_${h}`)) || []; if (logs.length>0 && logs[logs.length-1].fecha===hoy) { logs.pop(); localStorage.setItem(`logs_${estado.perfil}_${h}`, JSON.stringify(logs)); mostrarToast("↩️ Serie borrada."); renderEntrenar(); } }

            setTimeout(() => cambiarVista('planeacion'), 2500);
        }

        function iniciarDescansoGlobal(s) {
            estado.descanso.fin = Date.now() + (s * 1000); 
            document.getElementById('global-rest-timer').style.display = 'block';
            if(estado.descanso.intervalo) clearInterval(estado.descanso.intervalo);
            estado.descanso.intervalo = setInterval(() => { 
                let r = Math.ceil((estado.descanso.fin - Date.now()) / 1000); 
                if(r <= 0) { cancelarDescanso(); mostrarToast("⏰ RECUPERACIÓN TERMINADA.", true); dispararClick(440, 0.4); return; } 
                document.getElementById('rest-time-display').textContent = `${Math.floor(r/60).toString().padStart(2,'0')}:${(r%60).toString().padStart(2,'0')}`; 
                document.getElementById('rest-progress-fill').style.width = `${(r/s)*100}%`; 
            }, 250); 
        }

        function ajustarDescanso(s) { estado.descanso.fin += (s*1000); } 
        function cancelarDescanso() { clearInterval(estado.descanso.intervalo); document.getElementById('global-rest-timer').style.display = 'none'; }

        /* =========================================================================
           AUDITORÍA Y GRÁFICOS NATIVOS (CANVAS)
           ========================================================================= */
        function dibujarGrafico(canvasId, dataArray, colorHex, labelText) {
            let cvs = document.getElementById(canvasId);
            if(!cvs) return;
            let ctx = cvs.getContext('2d');
            let w = cvs.width; let h = cvs.height;
            ctx.clearRect(0,0,w,h);
            
            if(dataArray.length === 0) {
                ctx.fillStyle = '#a1a1aa'; ctx.font = '12px sans-serif'; ctx.fillText('Sin datos suficientes', 10, h/2);
                return;
            }

            let maxVal = Math.max(...dataArray) || 10;
            let minVal = Math.min(...dataArray) || 0;
            // Evitar gráficos planos si todo es 0
            if(maxVal === minVal) { maxVal += 10; minVal = Math.max(0, minVal-10); }
            
            let padding = 15;
            let stepX = (w - (padding*2)) / Math.max(dataArray.length - 1, 1);
            let rangeY = maxVal - minVal;
            let scaleY = (h - (padding*2)) / rangeY; 

            ctx.beginPath();
            ctx.strokeStyle = colorHex; 
            ctx.lineWidth = 3;
            
            dataArray.forEach((val, i) => {
                let x = padding + (i * stepX);
                let y = h - padding - ((val - minVal) * scaleY);
                if(i===0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Dibujar puntos
            dataArray.forEach((val, i) => {
                let x = padding + (i * stepX);
                let y = h - padding - ((val - minVal) * scaleY);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x-3, y-3, 6, 6);
            });

            // Label min/max
            ctx.fillStyle = '#a1a1aa'; ctx.font = '10px monospace';
            ctx.fillText(maxVal.toLocaleString() + ' ' + labelText, padding, padding);
        }

        function procesarDatosGrafico() {
            // 1. Tonelaje Pierna Últimas 12 Semanas (agrupado por semanas)
            let tonSemanas = new Array(12).fill(0);
            let hrrDeltas = []; // Delta = Pico - Final
            let fatmaxHist = new Array(12).fill(0);

            let hoy = new Date();
            for(let i=0; i<localStorage.length; i++) {
                let k = localStorage.key(i);
                // Extraer HRR
                if(k === `logs_${estado.perfil}_ValidacionMensualHRR`) {
                    let logs = JSON.parse(localStorage.getItem(k)) || [];
                    // Tomar últimos 8 registros
                    logs.slice(-8).forEach(l => {
                        hrrDeltas.push(l.val1 - l.val2); // Delta vagal
                    });
                }
                // Extraer Fatmax
                if(k.startsWith(`fatmax_semanal_${estado.perfil}_`)) {
                    let fechaLog = new Date(k.replace(`fatmax_semanal_${estado.perfil}_`, ''));
                    let diffWeeks = Math.floor((hoy - fechaLog) / (1000 * 60 * 60 * 24 * 7));
                    if(diffWeeks >= 0 && diffWeeks < 12) {
                        fatmaxHist[11 - diffWeeks] += Math.floor((parseInt(localStorage.getItem(k))||0)/60);
                    }
                }
            }

            // Calcular Tonelaje Semanal de todo (excluyendo casa/cardio)
            for (let r in estado.db.rutinas) {
                estado.db.rutinas[r].ejercicios.forEach(ej => {
                    if(ej.tipo !== "time_seconds" && ej.tipo !== "time_to_failure" && !ej.es_casa && !ej.nombre.includes("HRR") && !ej.nombre.includes("Noruego")) {
                        let hash = ej.nombre.replace(/[^a-zA-Z0-9]/g, ''); 
                        let logs = JSON.parse(localStorage.getItem(`logs_${estado.perfil}_${hash}`)) || [];
                        logs.forEach(l => {
                            if(!l.is_aprox) {
                                let fechaLog = new Date(l.fecha);
                                let diffWeeks = Math.floor((hoy - fechaLog) / (1000 * 60 * 60 * 24 * 7));
                                if(diffWeeks >= 0 && diffWeeks < 12) {
                                    tonSemanas[11 - diffWeeks] += (l.val1 * l.val2);
                                }
                            }
                        });
                    }
                });
            }

            return { tonSemanas, hrrDeltas, fatmaxHist };
        }

                    <p style="font-size:0.7rem; color:var(--texto-sec); text-align:center; margin-bottom:8px;">Pega aquí la URL de tu Google Apps Script para respaldo silencioso. Se subirá automáticamente al terminar tu sesión.</p>
                    <input type="text" id="webhook-url" placeholder="https://script.google.com/macros/..." style="font-size:0.8rem; background:var(--bg-control); padding:10px; border-radius:8px; border:1px solid var(--borde); margin-bottom:12px; font-weight:normal;" onchange="localStorage.setItem('google_sheet_webhook', this.value)">

                    <button class="btn-undo" style="width:100%; height:45px; font-size:0.9rem;" onclick="document.getElementById('input-import-file').click()">📤 IMPORTAR JSON MANUAL</button>

        }

        /* --- PERSISTENCIA NUBE SILENCIOSA --- */
        async function sincronizarNubeSilenciosa() {
            const webhook = localStorage.getItem('google_sheet_webhook');
            if(!webhook) return; 

            let dataObj = {}; 
            for(let i=0; i<localStorage.length; i++){ let k = localStorage.key(i); dataObj[k] = localStorage.getItem(k); } 
            
            try {
                fetch(webhook, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ perfil: estado.perfil, timestamp: new Date().toISOString(), payload: JSON.stringify(dataObj) })
                });
                console.log("Datos enviados al Webhook exitosamente.");
            } catch(e) {
                console.log("Error de red. El respaldo se encolará para la siguiente sesión.");
            }
        }

        /* --- PERSISTENCIA LOCAL MANUAL --- */
        function exportarBackupCompleto() { 
            let data = {}; 
            for(let i=0; i<localStorage.length; i++){ let k = localStorage.key(i); data[k] = localStorage.getItem(k); } 
            const a = document.createElement("a"); 
            a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:"application/json"})); 
            a.download = `PUSHEEN_FIT_BACKUP_${estado.perfil}_${new Date().toISOString().slice(0,10)}.json`; 
            a.click(); 
            mostrarToast("📥 Respaldo local generado."); 
        }

        function importarBackupCompleto(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (confirm("⚠️ ADVERTENCIA: Esto sobreescribirá tus datos locales. ¿Proceder?")) {
                        localStorage.clear();
                        for (let k in data) { localStorage.setItem(k, data[k]); }
                        mostrarToast("✓ Datos inyectados con éxito. Reiniciando...");
                        setTimeout(() => location.reload(), 1500);
                    }
                } catch(err) { alert("❌ Error crítico: Archivo JSON no válido."); }
            };
            reader.readAsText(file);
        }

        window.onload = () => { 
            Object.keys(estado.db.rutinas).forEach(r => estado.indices[r] = 0); 
            // Cargar Triage Diario
            let hoy = new Date().toISOString().slice(0,10);
            let triageStatus = localStorage.getItem(`triage_done_${hoy}`);
            if(!triageStatus) {
                document.getElementById('modal-triage').style.display = 'flex';
                localStorage.setItem(`triage_done_${hoy}`, 'true');
            } else {
                document.getElementById('modal-triage').style.display = 'none';
            }
            cambiarVista('planeacion'); 
        };
