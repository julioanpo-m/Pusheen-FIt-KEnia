<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pusheen Fit S.O.E.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="julio">

    <header class="top-bar">
        <div class="pusheen-profile">
            <img src="assets/pusheen.png" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23555\'/><text x=\'50\' y=\'55\' font-size=\'30\' text-anchor=\'middle\' fill=\'white\'>🐱</text></svg>'" alt="Pusheen">
        </div>
        <div class="profile-selector">
            <button class="profile-btn active" id="prof-julio" onclick="cambiarPerfil('julio')">💀 Julio</button>
            <button class="profile-btn" id="prof-kenia" onclick="cambiarPerfil('kenia')">🐱 Kenia</button>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="btn-metronomo" id="btnGuardia" onclick="toggleGuardia()" style="font-size:1rem;">🏥</button>
            <button class="btn-metronomo" id="btnMetro" onclick="controlMetronomo()">🔊</button>
        </div>
    </header>

    <main id="app-canvas"></main>

    <!-- MODAL DE VIDEO PROET -->
    <dialog id="video-modal" class="modal-overlay">
        <div class="modal-content">
            <iframe id="video-frame" width="100%" height="250" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            <button class="btn-cerrar-modal" onclick="cerrarVideo()">✕ CERRAR Y CONTINUAR</button>
        </div>
    </dialog>

    <!-- TEMPORIZADOR GLOBAL DE DESCANSO -->
    <div id="global-rest-timer" class="global-timer" style="display:none;">
        <div class="timer-info">
            <span class="timer-lbl">⏳ DESCANSO ACTIVO</span>
            <span class="timer-val" id="rest-time-display">00:00</span>
        </div>
        <div class="timer-actions">
            <button class="btn-timer-macro" onclick="ajustarDescanso(15)">+15s</button>
            <button class="btn-timer-skip" onclick="cancelarDescanso()">OMITIR ⏩</button>
        </div>
        <div class="timer-progress-bg"><div class="timer-progress-fill" id="rest-progress-fill"></div></div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav class="bottom-nav">
        <button class="nav-btn active" id="nav-dashboard" onclick="cambiarVista('dashboard')">
            <span class="nav-icon">🎛️</span><span class="nav-text">Comando</span>
        </button>
        <button class="nav-btn" id="nav-entrenar" onclick="cambiarVista('entrenar')">
            <span class="nav-icon">🏋️</span><span class="nav-text">Rutina</span>
        </button>
        <button class="nav-btn" id="nav-cardio" onclick="cambiarVista('cardio')">
            <span class="nav-icon">🫁</span><span class="nav-text">Cardio</span>
        </button>
        <button class="nav-btn" id="nav-planeacion" onclick="cambiarVista('planeacion')">
            <span class="nav-icon">🗺️</span><span class="nav-text">Táctica</span>
        </button>
        <button class="nav-btn" id="nav-auditoria" onclick="cambiarVista('auditoria')">
            <span class="nav-icon">📊</span><span class="nav-text">Auditoría</span>
        </button>
    </nav>

    <div id="toast-message"></div>
    
    <script src="rutinas.js"></script>
    <script src="adaptador.js"></script>
    <script src="auditoria.js"></script>
    <script src="app.js"></script>
</body>
</html>
